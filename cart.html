<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MON PANIER - ICOSIUM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo3.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body> 
   <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: var(--color-primary); display: flex; align-items: center; gap: 10px;">
                    <img src="images/logo3.png" alt="Logo" class="brand-logo">
                    ICOSIUM
                </a>
            </div>
            
            <nav class="main-nav">
                <a href="index.html" data-key="cart_back_home">Retour à l'accueil</a>
            </nav>

            <div class="header-controls">
                <button id="dark-mode-toggle"><i class="fas fa-moon"></i></button>
                <select id="language-switcher">
                    <option value="fr">FR</option>
                    <option value="ar">AR</option> 
                    <option value="en">EN</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 40px; margin-bottom: 60px;">
        <h1 class="section-title" data-key="checkout_title">Finaliser votre commande</h1>

        <div class="cart-page-wrapper">
            
            <div class="cart-items-section">
                <h3><span data-key="cart_items_title">Articles dans le panier</span> (<span id="cart-count-page">0</span>)</h3>
                <div id="cart-items-container-page">
                    <p data-key="cart_empty">Votre panier est vide.</p>
                </div>
            </div>

            <div class="cart-form-section">
             <div class="cart-summary-box">
    <div class="checkout-box-header">
        <i class="fas fa-truck-fast"></i>
        <h3 data-key="checkout_delivery_details">Détails de livraison</h3>
    </div>
    
    <form id="checkout-form-page">
        <div class="checkout-field">
            <label for="checkout-name" data-key="form_name">Nom Complet</label>
            <div class="input-wrapper">
                <i class="fas fa-user"></i>
                <input type="text" id="checkout-name" required placeholder="Votre nom et prénom">
            </div>
        </div>

        <div class="checkout-field">
            <label for="checkout-phone" data-key="form_phone">Numéro de Téléphone</label>
            <div class="input-wrapper">
                <i class="fas fa-phone"></i>
                <input type="tel" id="checkout-phone" required placeholder="05 / 06 / 07...">
            </div>
        </div>

        <div class="checkout-field">
            <label for="checkout-wilaya" data-key="form_wilaya">Wilaya de livraison</label>
            <div class="input-wrapper">
                <i class="fas fa-map-location-dot"></i>
                <select id="checkout-wilaya" required>
                    <option value="" disabled selected data-key="select_wilaya">Choisir Wilaya</option>
                </select>
            </div>
        </div>

        <div class="checkout-field">
            <label for="checkout-address" data-key="form_address">Adresse de livraison (Commune / Quartier)</label>
            <div class="input-wrapper">
                <i class="fas fa-location-dot"></i>
                <input type="text" id="checkout-address" required placeholder="Ex: Bab Ezzouar, Cité...">
            </div>
        </div>

        <div class="checkout-divider"></div>

        <!-- ملخص الأسعار -->
        <div class="checkout-pricing">
            <div class="price-line">
                <span data-key="cart_subtotal">Sous-total</span>
                <span><strong id="cart-total-price-page">0</strong> DZD</span>
            </div>
            <div class="price-line">
                <span data-key="delivery_fee">Frais de livraison</span>
                <span><strong id="delivery-fee-display">0</strong> DZD</span>
            </div>
            <div class="price-line total-highlight">
                <span data-key="cart_final_total">Total Final</span>
                <span class="total-amount"><span id="final-total-price">0</span> DZD</span>
            </div>
        </div>

        <!-- زر التأكيد -->
        <button type="submit" id="checkout-submit-btn" class="btn-confirm-order">
            <i class="fas fa-shield-halved"></i>
            <span data-key="form_confirm">Confirmer la commande</span>
        </button>

        <p class="cod-hint">
            <i class="fas fa-hand-holding-dollar"></i> Paiement en espèces à la livraison
        </p>
    </form>
</div>
            </div>

        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 <strong>ICOSIUM STORE</strong>. <span data-key="footer_rights">Tous droits réservés.</span></p>
        </div>
    </footer>
<!-- نافذة عرض الصورة المكبرة عند النقر -->
    <div id="image-lightbox-modal" class="modal" style="display:none; align-items:center; justify-content:center;">
        <div style="position: relative; max-width: 90%; max-height: 85vh; text-align: center;">
            <span class="close-btn" onclick="closeImageLightbox()" style="position: absolute; top: -35px; right: -5px; color: #fff; font-size: 32px; cursor: pointer;">&times;</span>
            <img id="lightbox-img" src="" alt="Aperçu" style="max-width: 100%; max-height: 80vh; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); object-fit: contain;">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <!-- نافذة تأكيد واستلام الطلب -->
<div id="order-success-modal" class="modal" style="display:none; align-items:center; justify-content:center; z-index: 3000;">
    <div class="modal-content" style="max-width: 460px; text-align: center; padding: 35px 25px; border-radius: 20px;">
        <div style="width: 70px; height: 70px; background: rgba(0, 200, 150, 0.15); color: var(--color-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 20px;">
            <i class="fas fa-check"></i>
        </div>
        <h2 id="success-title" style="font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 12px;"></h2>
        <p id="success-msg" style="color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px;"></p>
        
        <button type="button" id="btn-success-home" class="btn-confirm-order" style="margin: 0 auto; max-width: 220px;" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left"></i> <span id="success-btn-text"></span>
        </button>
    </div>
</div>
</body>
</html>
