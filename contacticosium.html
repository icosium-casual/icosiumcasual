<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICOSIUM CASUAL | Contact & Liens</title>
    
    <!-- أيقونة الموقع -->
    <link rel="icon" type="image/png" href="images/logo3.png">
    
    <!-- الأيقونات (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* استدعاء خطوط البراند */
        @import url('https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,900&f[]=satoshi@500,700&display=swap');
        
        :root { 
            --bg: #050505; 
            --text: #ffffff; 
            --green: #166b5a; 
            --lime: #2fc1bb; 
            --card-border: rgba(255, 255, 255, 0.15);
        }
        
        body { 
            font-family: 'Satoshi', sans-serif; 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 40px 20px; 
            
            /* الخلفية الطبوغرافية المدمجة مع تظليل داكن */
            background-color: var(--bg);
            background-image: 
                linear-gradient(to bottom, rgba(5, 5, 5, 0.65), rgba(5, 5, 5, 0.9)),
                url('image.png'); /* تأكد أن الصورة في نفس مسار الملف */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        .link-container { 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            position: relative;
            z-index: 2;
        }
        
        /* اللوغو والترحيب */
        .logo { 
            width: 90px; 
            height: 90px; 
            margin-bottom: 20px; 
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        
        h1 { 
            font-family: 'Cabinet Grotesk', sans-serif; 
            font-size: 28px; 
            margin: 0 0 8px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }
        
        p.subtitle { 
            font-size: 14px; 
            color: #cbd5e1; 
            margin-bottom: 35px; 
            letter-spacing: 1px;
        }
        
        /* تصميم الأزرار (تأثير زجاجي) */
        .btn-link { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 15px; 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); /* تأثير ضبابي للخلفية */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border); 
            color: #fff; 
            text-decoration: none; 
            font-weight: 700; 
            border-radius: 14px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            font-size: 15px; 
        }
        
        .btn-link i {
            font-size: 18px;
        }
        
        .btn-link:hover { 
            border-color: var(--lime); 
            background: rgba(47, 193, 187, 0.15); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(47, 193, 187, 0.2);
        }

        /* زر الإيميل */
        .btn-email:hover {
            border-color: #ea4335;
            background: rgba(234, 67, 53, 0.15);
            box-shadow: 0 8px 20px rgba(234, 67, 53, 0.2);
        }
        
        /* زر المتجر الأساسي (مميز) */
        .btn-store { 
            background: var(--text); 
            color: var(--bg); 
            border-color: var(--text); 
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 17px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-store:hover { 
            background: var(--green); 
            border-color: var(--green); 
            color: #fff; 
            box-shadow: 0 10px 30px rgba(22, 107, 90, 0.4);
        }
        
        /* لوغو Casual by Nature في الأسفل */
        .cbn-logo { 
            width: 140px; 
            margin-top: 40px; 
            opacity: 0.6; 
            transition: 0.3s;
        }
        
        .cbn-logo:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="link-container">
        <!-- اللوغو والترحيب -->
        <img src="images/logo3.png" alt="ICOSIUM LOGO" class="logo" onerror="this.src='logo3.png'">
        <h1>ICOSIUM CASUAL</h1>
        <p class="subtitle">Bienvenue dans l'univers Vero. Streetwear pensé en Algérie.</p>

        <!-- زر المتجر الإلكتروني -->
        <a href="https://www.icosiumcasual.com/" class="btn-link btn-store">
            <i class="fas fa-shopping-bag"></i> Visiter la Boutique
        </a>

        <!-- زر الواتساب -->
        <a href="https://wa.me/213780331979" target="_blank" class="btn-link">
            <i class="fab fa-whatsapp" style="color: #25D366;"></i> WhatsApp
        </a>

        <!-- زر الإنستغرام -->
        <a href="https://www.instagram.com/icosium.casual" target="_blank" class="btn-link">
            <i class="fab fa-instagram" style="color: #E1306C;"></i> Instagram
        </a>

        <!-- زر تيك توك -->
        <a href="https://www.tiktok.com/@icosium.casual" target="_blank" class="btn-link">
            <i class="fab fa-tiktok"></i> TikTok
        </a>

        <!-- زر فيسبوك -->
        <a href="https://www.facebook.com/icosium.casual/" target="_blank" class="btn-link">
            <i class="fab fa-facebook-f" style="color: #1877F2;"></i> Facebook
        </a>

        <!-- زر الإيميل -->
             <p class="subtitle">Casual by nature</p>


        <!-- ختم الهوية -->
    </div>
</body>
</html>
